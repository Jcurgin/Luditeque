# Construit le fichier app-release.aab à envoyer sur Google Play.
# Lancement : onglet « Actions » du dépôt → « Construire l'appli Android » → « Run workflow ».
name: Construire l'appli Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché (ex. 1.0, 1.1)"
        required: true
        default: "1.0"

jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'appli dans le projet Android
        run: npx cap sync android

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Le secret KEYSTORE_BASE64 est manquant (voir GUIDE.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Construire le fichier .aab signé
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Mettre le fichier à disposition
        uses: actions/upload-artifact@v6
        with:
          name: luditeque-aab-v${{ inputs.version_name }}-build${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
