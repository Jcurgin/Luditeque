<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Luditèque</title>
<script src="three.min.js"></script>
<style>
@font-face{font-family:"Fredoka";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2")}
</style>
<style>
:root{
  --bg:#e6f3ff; --bg2:#d3e9ff; --surface:#ffffff; --ink:#26205a; --muted:#6a6494;
  --primary:#7c5cff; --primary-d:#5b3fd9;
  --w1:#12b5c6; --w1-d:#0a8594; --w2:#3ea34a; --w2-d:#2a7a34; --w3:#ff8a3d; --w3-d:#d4651b; --w4:#e0508f; --w4-d:#b02f69;
  --good:#22b573; --good-d:#168a55; --bad:#ff6363; --gold:#ffc83d; --gold-d:#e0a412;
  --line:#c9ddf2; --key:#f2f0ff; --key-d:#cfc8f5;
  --sky1:#7fcbff; --sky2:#e3f5ff; --hill1:#6cc35a; --hill2:#9fdc85; --hill3:#c4ec9f; --cloud:#ffffff; --doodle:#ffffff; --day-o:1; --night-o:0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191539; --bg2:#211c4a; --surface:#2b2560; --ink:#f3f0ff; --muted:#b5addf;
    --line:#3d357a; --key:#3a3378; --key-d:#231e52; color-scheme:dark;
    --sky1:#0d0a2b; --sky2:#2b2470; --hill1:#1d4a5c; --hill2:#26607a; --hill3:#2f7590; --cloud:rgba(255,255,255,.13); --doodle:rgba(255,255,255,.7); --day-o:0; --night-o:1;
  }
}
:root[data-theme="dark"]{
  --bg:#191539; --bg2:#211c4a; --surface:#2b2560; --ink:#f3f0ff; --muted:#b5addf;
  --line:#3d357a; --key:#3a3378; --key-d:#231e52; color-scheme:dark;
  --sky1:#0d0a2b; --sky2:#2b2470; --hill1:#1d4a5c; --hill2:#26607a; --hill3:#2f7590; --cloud:rgba(255,255,255,.13); --doodle:rgba(255,255,255,.7); --day-o:0; --night-o:1;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{max-width:860px;margin:0 auto;padding:16px 18px 32px;min-height:100%;display:flex;flex-direction:column}

/* Boutons « jouet » */
.btn{border:none;border-radius:20px;padding:14px 22px;font-size:1.25rem;font-weight:600;color:#fff;background:var(--primary);box-shadow:0 6px 0 var(--primary-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--primary-d)}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.soft:active{box-shadow:0 1px 0 var(--line)}
.btn.gold{background:var(--gold);color:#4a3500;box-shadow:0 6px 0 var(--gold-d)}
.btn.good{background:var(--good);box-shadow:0 6px 0 var(--good-d)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:none;background:var(--surface);color:var(--ink);width:54px;height:54px;border-radius:18px;font-size:1.5rem;box-shadow:0 5px 0 var(--line);flex:none}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}

.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top h1{flex:1;margin:0;font-size:1.6rem;font-weight:700;line-height:1.1}
.coins{background:var(--surface);border-radius:999px;padding:8px 16px;font-size:1.3rem;font-weight:600;box-shadow:0 4px 0 var(--line);white-space:nowrap}
.spacer{flex:1}

/* Accueil */
.hero{display:flex;align-items:center;gap:8px;margin:6px 0 18px}
.hero .mascot{width:150px;flex:none}
.bubble{position:relative;background:var(--surface);border-radius:26px;padding:18px 22px;font-size:1.45rem;font-weight:500;line-height:1.3;box-shadow:0 6px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid var(--surface);border-left:0}
.bubble small{display:block;font-size:1.05rem;color:var(--muted);font-weight:400;margin-top:4px}
.worlds{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.world{border:none;border-radius:28px;padding:20px 18px 18px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:170px;position:relative;overflow:hidden;transition:transform .08s,box-shadow .08s}
.world:active{transform:translateY(6px)}
.world .em{font-size:3.2rem;line-height:1}
.world .nm{font-size:1.45rem;font-weight:700;line-height:1.1}
.world .sb{font-size:1rem;opacity:.92}
.world .pg{margin-top:auto;font-size:1.05rem;font-weight:600;background:rgba(0,0,0,.18);align-self:flex-start;padding:4px 12px;border-radius:999px}
.w1{background:var(--w1);box-shadow:0 8px 0 var(--w1-d)} .w1:active{box-shadow:0 2px 0 var(--w1-d)}
.w2{background:var(--w2);box-shadow:0 8px 0 var(--w2-d)} .w2:active{box-shadow:0 2px 0 var(--w2-d)}
.w3{background:var(--w3);box-shadow:0 8px 0 var(--w3-d)} .w3:active{box-shadow:0 2px 0 var(--w3-d)}
.w4{background:var(--w4);box-shadow:0 8px 0 var(--w4-d)} .w4:active{box-shadow:0 2px 0 var(--w4-d)}
.row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.row .btn{flex:1;min-width:200px}

/* Carte d'un monde */
.path{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.lvl{display:flex;align-items:center;gap:16px;border:none;border-radius:24px;padding:14px 18px;background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 6px 0 var(--line);font-size:1.25rem}
.lvl:nth-child(even){margin-left:min(12vw,90px)}
.lvl:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.lvl .n{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:700;color:#fff;flex:none}
.lvl .t{flex:1;font-weight:600;line-height:1.15}
.lvl .st{font-size:1.4rem;letter-spacing:2px;white-space:nowrap}
.lvl.locked{opacity:.55}
.lvl.locked .n{background:#9b96bf !important}
.star-off{filter:grayscale(1);opacity:.35}

/* Jeu */
.game{display:flex;flex-direction:column;flex:1;gap:14px}
.gtop{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dot{width:100%;max-width:34px;height:12px;border-radius:6px;background:var(--line)}
.dot.done{background:var(--good)} .dot.cur{background:var(--gold)}
.qcard{background:var(--surface);border-radius:30px;padding:24px 20px;text-align:center;box-shadow:0 8px 0 var(--line)}
.prompt{font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:600;line-height:1.35}
.prompt b{color:var(--primary)}
.blank{display:inline-block;min-width:2.6ch;padding:0 10px;border-bottom:5px solid var(--primary);color:var(--primary);border-radius:6px;background:rgba(124,92,255,.10)}
.blank.filled{color:var(--good);border-color:var(--good);background:rgba(34,181,115,.12)}
.visual{margin-bottom:14px;display:flex;justify-content:center}
.clock{width:min(240px,60vw)}
.clock .face{fill:var(--surface);stroke:var(--ink);stroke-width:6}
.clock text{fill:var(--ink);font-family:inherit;font-weight:600;font-size:17px}
.clock .tick{stroke:var(--muted);stroke-width:2}
.clock .hh{stroke:var(--w3);stroke-width:8;stroke-linecap:round}
.clock .mh{stroke:var(--primary);stroke-width:5;stroke-linecap:round}
.money{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.bill{width:120px;height:64px;border-radius:10px;display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff;border:3px solid rgba(0,0,0,.15)}
.b5{background:#8e9a8f}.b10{background:#d8504d}.b20{background:#4a78c9}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1rem;font-weight:700;color:#3d3000}
.c1{background:radial-gradient(circle,#dfe3e8 0 52%,#e8c14a 54%)}
.c2{background:radial-gradient(circle,#e8c14a 0 52%,#dfe3e8 54%)}
.choices{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.choice{border:none;border-radius:24px;min-height:84px;font-size:clamp(1.5rem,4vw,2rem);font-weight:600;background:var(--surface);color:var(--ink);box-shadow:0 7px 0 var(--line);padding:10px}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.choice.good{background:var(--good);color:#fff;box-shadow:0 7px 0 var(--good-d)}
.choice.bad{background:var(--bad);color:#fff;box-shadow:0 7px 0 #c94040;animation:shake .35s}
.choice:disabled{cursor:default}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;width:100%;margin:0 auto}
.key{border:none;border-radius:20px;height:70px;font-size:2rem;font-weight:600;background:var(--key);color:var(--ink);box-shadow:0 6px 0 var(--key-d)}
.key:active{transform:translateY(5px);box-shadow:0 1px 0 var(--key-d)}
.key.ok{background:var(--good);color:#fff;box-shadow:0 6px 0 var(--good-d)}
.key.del{background:var(--surface);box-shadow:0 6px 0 var(--line)}
.fb{display:flex;align-items:center;gap:12px;min-height:96px}
.fb .mascot{width:86px;flex:none}
.fbtext{flex:1;font-size:1.3rem;line-height:1.35;font-weight:500}
.fbtext .btn{margin-top:10px}

/* Fin de niveau */
.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1;justify-content:center}
.end h2{font-size:2.3rem;margin:0}
.bigstars{font-size:4rem;display:flex;gap:10px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.gain{font-size:1.6rem;font-weight:600}
.sticker-new{background:var(--surface);border-radius:26px;padding:14px 26px;box-shadow:0 6px 0 var(--line);font-size:1.25rem;font-weight:500}
.sticker-new .e{font-size:4rem;display:block;animation:pop .6s .8s backwards}
.end .mascot{width:130px}
.end .row{justify-content:center;width:100%;max-width:600px}

/* Album et boutique */
.section-title{font-size:1.35rem;font-weight:700;margin:20px 0 10px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.stk{aspect-ratio:1;border-radius:24px;background:var(--surface);display:grid;place-items:center;font-size:3rem;box-shadow:0 5px 0 var(--line);position:relative}
.stk.empty{font-size:2rem;color:var(--muted);background:transparent;border:3px dashed var(--line);box-shadow:none}
.stk.gold{background:linear-gradient(145deg,#fff3c4,var(--gold));box-shadow:0 5px 0 var(--gold-d)}
.stk small{position:absolute;bottom:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.stk.gold small{color:#6b4d00}
/* Décor */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.sky1{stop-color:var(--sky1)} .sky2{stop-color:var(--sky2)} .skyc{fill:var(--sky1)}
.hill1{fill:var(--hill1)} .hill2{fill:var(--hill2)} .hill3{fill:var(--hill3)}
.cloud{fill:var(--cloud)}
.day{opacity:var(--day-o)} .night{opacity:var(--night-o)}
.doodle{fill:var(--doodle);opacity:.5;font-family:"Fredoka",sans-serif;font-weight:700}
.drift{animation:drift 80s linear infinite} .drift2{animation:drift 130s linear infinite;animation-delay:-55s}
.bob{animation:bob 6s ease-in-out infinite}
.twinkle{animation:tw 3s ease-in-out infinite} .twinkle:nth-child(3n){animation-delay:-1s} .twinkle:nth-child(3n+1){animation-delay:-2s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}

/* Avatar et garde-robe */
.avatar{display:block;width:100%}
.avwrap{width:170px;flex:none;cursor:pointer}
.av3d{width:100%;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg2);touch-action:pan-y;cursor:grab;box-shadow:0 6px 0 var(--line)}
.av3d canvas{display:block;width:100%;height:100%}
.avend{width:min(230px,55vw)}
.wardrobe{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0}
.wprev{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.wprev .av3d{height:calc(100vh - 450px);height:calc(100dvh - 450px);min-height:240px;max-height:680px;width:auto;max-width:100%;aspect-ratio:3/4;border-radius:32px;box-shadow:0 10px 0 var(--line)}
.wact{background:var(--surface);border-radius:22px;padding:10px 16px;box-shadow:0 5px 0 var(--line);font-size:1.1rem;font-weight:500;text-align:center;max-width:480px;width:100%}
.wact .btns{display:flex;gap:10px;margin-top:8px}
.wact .btn{flex:1;padding:10px 14px;font-size:1.1rem}
.wpanel{width:100%;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tab{border:none;border-radius:16px;padding:10px 14px;background:var(--surface);color:var(--ink);font-size:1.05rem;font-weight:600;white-space:nowrap;box-shadow:0 4px 0 var(--line)}
.tab.on{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.tiles{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.tile{flex:0 0 112px}
.tile{border:3px solid transparent;border-radius:22px;background:var(--surface);color:var(--ink);padding:8px 6px 10px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.95rem;font-weight:600;line-height:1.15}
.tile .ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:var(--bg)}
.tile .ic.sw{border:3px solid rgba(0,0,0,.1)}
.tile .tag{font-size:.85rem;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--muted)}
.tile.on{border-color:var(--gold)} .tile.on .tag{background:var(--gold);color:#4a3500}
.tile.sel{border-color:var(--primary)}
.tile.price .tag{background:rgba(255,200,61,.28);color:var(--ink)}


/* Espace parents */
.panel{background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 var(--line);margin-bottom:14px;font-size:1.1rem;line-height:1.45}
.panel h3{margin:0 0 8px;font-size:1.25rem}
.panel .lv{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.panel .lv:first-of-type{border-top:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:none}
.sw{border:none;width:66px;height:36px;border-radius:18px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--good)} .sw.on::after{left:34px}
.field{width:100%;font-family:inherit;font-size:1.4rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);user-select:text;-webkit-user-select:text}
.name-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.name-screen .mascot{width:170px}
.name-screen h1{font-size:2.2rem;margin:0}
.name-screen .field{max-width:360px;text-align:center}
.muted{color:var(--muted)}

/* Sciences */
.choices.long{grid-template-columns:1fr}
.choices.long .choice{font-size:clamp(1.15rem,3.2vw,1.45rem);min-height:64px}
.choice .num{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#fff;color:var(--good-d);margin-right:8px;font-size:.85em}
.fiche{background:var(--surface);border-radius:30px;padding:22px 24px;box-shadow:0 8px 0 var(--line);font-size:1.25rem;line-height:1.55;user-select:text;-webkit-user-select:text}
.fiche p{margin:0 0 14px;max-width:62ch}
.fem{font-size:3.6rem;text-align:center;line-height:1;margin-bottom:10px}
.fact{background:rgba(255,200,61,.24);border-radius:18px;padding:12px 16px;margin-top:6px}
.thermo{margin:6px 0 16px;background:var(--bg);border-radius:20px;padding:14px 16px}
.tout{display:flex;align-items:center;gap:14px;font-size:1.25rem;margin-bottom:8px;min-height:72px}
.te{font-size:3rem}
#thermo{width:100%;height:40px;accent-color:var(--w4)}
.tl{display:flex;justify-content:space-between;font-size:.95rem}
.planets{overflow-x:auto;margin:6px 0 16px;background:#1d1846;border-radius:20px;padding:8px 0}
.planets svg{display:block;height:150px}
.planets text{fill:#fff;font-size:14px;font-family:inherit;font-weight:600}

/* Mascotte */
.mascot{display:block;overflow:visible}
.mascot.happy{animation:hop .6s}
.mascot.think{animation:tilt .6s}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}

@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}65%{transform:translateY(0) rotate(3deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:560px){
  .top h1{font-size:1.25rem}
  .hero .mascot,.avwrap{width:118px}
  .bubble{font-size:1.2rem}
  .lvl:nth-child(even){margin-left:24px}
  .key{height:62px}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky1"/><stop offset="1" class="sky2"/></linearGradient></defs>

<script>
"use strict";
/* ---------- Outils ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

/* ---------- Sauvegarde ---------- */
const KEY="luditeque-v1";
const DEF={name:"",coins:0,progress:{},owned:[],wear:{hat:null,face:null,neck:null},stats:{},sound:true,autoVoice:false,unlockAll:false,
  av:{skin:"s1",eyes:"e1",hair:"h1",hairColor:"hc2",top:"t1",bottom:"b1",shoes:"sh1",hat:null,glasses:null,back:null,hand:null,pet:null,bg:"bg1"}};
function load(){
  try{const r=localStorage.getItem(KEY);const base=JSON.parse(JSON.stringify(DEF));if(!r)return base;
    const d=JSON.parse(r);return Object.assign(base,d,{wear:Object.assign(base.wear,d.wear||{})});}
  catch(e){return JSON.parse(JSON.stringify(DEF));}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
S.av=Object.assign({},DEF.av,S.av||{});
if(S.av.cape&&!S.av.back)S.av.back=S.av.cape;delete S.av.cape;
/* Ancienne boutique de Pilou : on rembourse les pièces */
(()=>{const old={glasses:30,bow:40,cap:60,party:80,crown:150};let r=0;S.owned=S.owned.filter(id=>{if(old[id]){r+=old[id];return false;}return true;});S.coins+=r;S.wear={hat:null,face:null,neck:null};save();})();

/* ---------- Sons et voix ---------- */
let AC=null;
function tone(freqs,dur=0.12,type="triangle"){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const t=AC.currentTime+i*dur;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur*1.6);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur*1.8);});
  }catch(e){}
}
const sfx={good:()=>tone([660,880]),bad:()=>tone([320,240],0.14,"sine"),win:()=>tone([523,659,784,1047],0.13),tap:()=>tone([500],0.05)};
function say(text){
  const tts=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;
  if(tts){try{tts.stop().catch(()=>{}).then(()=>tts.speak({text,lang:"fr-FR",rate:0.95,pitch:1.05,volume:1,category:"ambient"})).catch(()=>{});}catch(e){}return;}
  if(!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=0.92;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("fr"));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function spoken(q){
  const fill=q.blankSay||"…";
  return q.prompt.replace(/<[^>]+>/g,"").replace(/___/g," "+fill+" ").replace(/×/g," fois ").replace(/\+/g," plus ").replace(/−/g," moins ").replace(/=/g," égale ");
}

/* ---------- Nombres en lettres (orthographe rectifiée) ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const T={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function b100(n){
  if(n<20)return U[n];const t=Math.floor(n/10),u=n%10;
  if(t===7)return u===1?"soixante-et-onze":"soixante-"+U[10+u];
  if(t===8)return u===0?"quatre-vingts":"quatre-vingt-"+U[u];
  if(t===9)return "quatre-vingt-"+U[10+u];
  if(u===0)return T[t];if(u===1)return T[t]+"-et-un";return T[t]+"-"+U[u];
}
function toFr(n){if(n<100)return b100(n);const c=Math.floor(n/100),r=n%100;
  const s=c===1?"cent":U[c]+"-cent"+(r===0?"s":"");return r===0?s:s+"-"+b100(r);}

/* ---------- Fabriques de questions ---------- */
function num(prompt,answer,hint,extra={}){return Object.assign({type:"input",prompt,answer,hint,blankSay:"combien"},extra);}
function qcm(prompt,answer,choices,hint,extra={}){
  return Object.assign({type:"choice",prompt,answer:String(answer),choices:(extra.fixed?choices:shuffle(choices)).map(String),hint},extra);
}

/* Île des Nombres */
function m1(){
  if(Math.random()<0.3){const x=R(1,9);return num(`${x} + ___ = 10`,10-x,"Compte sur tes doigts ce qu’il manque pour arriver à 10.");}
  const a=R(11,68),at=Math.floor(a/10),au=a%10,b=R(1,8-at)*10+R(0,9-au);
  return num(`${a} + ${b} = ___`,a+b,"Ajoute d’abord les unités, puis les dizaines.");
}
function m2(){
  if(Math.random()<0.3){const t=R(1,9)*10;return num(`${t} + ___ = 100`,100-t,"Compte de 10 en 10 jusqu’à 100.");}
  const a=R(25,99),au=a%10,bt=R(1,Math.floor(a/10)-1),b=bt*10+R(0,au);
  return num(`${a} − ${b} = ___`,a-b,"Enlève d’abord les unités, puis les dizaines.");
}
function m3(){
  const at=R(1,6),au=R(2,9),bu=R(10-au,9),bt=R(1,8-at),a=at*10+au,b=bt*10+bu;
  return num(`${a} + ${b} = ___`,a+b,"Les unités dépassent 9 : 10 unités font 1 dizaine de plus. N’oublie pas la retenue !");
}
function m4(){const t=pick([2,5,10]),n=R(1,10);return num(`${n} × ${t} = ___`,n*t,`Compte de ${t} en ${t}, ${n} fois.`);}
function m5(){
  const r=Math.random();
  if(r<0.6){const t=pick([3,4]),n=R(1,10);return num(`${n} × ${t} = ___`,n*t,`Compte de ${t} en ${t}, ${n} fois.`);}
  if(r<0.8){const n=R(6,50);return num(`Le double de <b>${n}</b>, c’est ___`,2*n,"Le double, c’est le nombre ajouté à lui-même.");}
  const n=R(3,30);return num(`La moitié de <b>${2*n}</b>, c’est ___`,n,"La moitié, c’est partager en 2 parts égales.");
}
function m6(){
  const n=R(101,999),r=Math.random();
  if(r<0.3){const k=pick([["unités",n%10],["dizaines",Math.floor(n/10)%10],["centaines",Math.floor(n/100)]]);
    return num(`Dans <b>${n}</b>, quel est le chiffre des ${k[0]} ? ___`,k[1],"De droite à gauche : unités, dizaines, centaines.",{key:`${n}-${k[0]}`});}
  if(r<0.65)return num(`Écris en chiffres :<br><b>${toFr(n)}</b><br>___`,n,"Cherche d’abord les centaines, puis les dizaines, puis les unités.",{blankSay:""});
  const c=Math.floor(n/100)*100,set=new Set();while(set.size<3)set.add(c+R(0,99));const arr=[...set];
  return qcm("Quel est le plus grand nombre ?",Math.max(...arr),arr,"Les centaines sont pareilles : compare les dizaines, puis les unités.",{key:arr.sort().join()});
}

function f1(){const [p,a]=pick(AA);return qcm(p,a,["a","à"],"Essaie de dire « avait » à la place. Si ça marche, on écrit « a » sans accent.",{fixed:true});}

/* Vallée du Temps */
const fmtH=(h,m)=>m?`${h} h ${String(m).padStart(2,"0")}`:`${h} h`;
function clockSVG(h,m){
  let s="";for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?86:82;s+=`<line class="tick" x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*90}" y2="${100-Math.cos(a)*90}"/>`;}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${100+Math.sin(a)*68}" y="${100-Math.cos(a)*68}" text-anchor="middle" dominant-baseline="central">${i}</text>`;}
  const ha=((h%12)+m/60)*30,ma=m*6;
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Horloge"><circle class="face" cx="100" cy="100" r="94"/>${s}
  <line class="hh" x1="100" y1="100" x2="100" y2="55" transform="rotate(${ha} 100 100)"/>
  <line class="mh" x1="100" y1="100" x2="100" y2="26" transform="rotate(${ma} 100 100)"/>
  <circle cx="100" cy="100" r="7" fill="#26205a"/></svg>`;
}
function clockQ(mins){
  const h=R(1,12),m=pick(mins),ans=fmtH(h,m),c=new Set([ans]);
  const near=[h,h%12+1,(h+10)%12+1];let g=0;
  while(c.size<4&&g++<50)c.add(fmtH(pick(near),pick(mins.length>1?mins:[0,30])));
  while(c.size<4)c.add(fmtH(R(1,12),m));
  return qcm("Quelle heure est-il ?",ans,[...c],"La petite aiguille orange montre les heures. La grande aiguille violette montre les minutes.",{visual:clockSVG(h,m),key:ans});
}
const t1=()=>clockQ([0]);
const t2=()=>clockQ([0,30]);
const t3=()=>clockQ([15,30,45,0]);
function t4(){
  const n=R(2,5),items=[];for(let i=0;i<n;i++)items.push(pick([1,2,2,5,10,20]));items.sort((a,b)=>b-a);
  const html='<div class="money">'+items.map(v=>v>=5?`<div class="bill b${v}">${v} €</div>`:`<div class="coin c${v}">${v} €</div>`).join("")+"</div>";
  return num("Combien d’euros en tout ? ___ €",items.reduce((a,b)=>a+b,0),"Commence par les billets, puis ajoute les pièces une par une.",{visual:html,key:items.join(),blankSay:"combien d’euros"});
}

function widget(k){
  if(k==="thermo")return `<div class="thermo"><div class="tout" id="thermoOut"></div><input type="range" min="-20" max="120" value="20" step="1" id="thermo" aria-label="Température"><div class="muted tl"><span>−20 °C</span><span>120 °C</span></div></div>`;
  if(k==="planets"){
    const P=[["Mercure",5,"#b5a89a"],["Vénus",11,"#e8c27a"],["Terre",12,"#3f8fe0"],["Mars",8,"#d9603b"],["Jupiter",38,"#d9a874"],["Saturne",32,"#e6cf8f"],["Uranus",19,"#8fd8e0"],["Neptune",18,"#4f6fe0"]];
    let x=60,pr=0,s=`<circle cx="-40" cy="62" r="80" fill="#ffc83d"/>`;
    P.forEach(([n,r,c],k)=>{x+=k===0?r+20:Math.max(pr+r+(n==="Uranus"?34:22),76);pr=r;
      if(n==="Saturne")s+=`<ellipse cx="${x}" cy="62" rx="${r+18}" ry="8" fill="none" stroke="#c9ad62" stroke-width="3"/>`;
      s+=`<circle cx="${x}" cy="62" r="${r}" fill="${c}"/><text x="${x}" y="128" text-anchor="middle">${n}</text>`;});
    const wd=x+50;return `<div class="planets"><svg viewBox="0 0 ${wd} 145" style="width:${wd}px" role="img" aria-label="Les planètes du système solaire">${s}</svg></div>`;
  }
  return "";
}
function updThermo(){const i=$("thermo"),o=$("thermoOut");if(!i||!o)return;const t=+i.value;

  o.innerHTML=`<span class="te">${s[0]}</span><span><b>${t} °C</b><br>C’est ${s[1]} : état ${s[2]}.</span>`;}

const HELLO=["On joue ?","Prêt pour l’aventure ?","Quel monde aujourd’hui ?","Je t’attendais !"];

function render(){
  MOUNT=null;const v=view.name;const sT=(app.querySelector(".tabs")||{}).scrollLeft||0,sI=(app.querySelector(".tiles")||{}).scrollLeft||0,sameCat=render.cat===view.cat;render.cat=view.cat;
  app.innerHTML=v==="name"?scrName():v==="home"?scrHome():v==="world"?scrWorld():v==="game"?scrGame():v==="end"?scrEnd():v==="album"?scrAlbum():v==="shop"?scrShop():v==="gate"?scrGate():v==="parents"?scrParents():v==="fiche"?scrFiche():"";
  if(v!==render.last||v==="game")window.scrollTo(0,0);render.last=v;if(v==="fiche")updThermo();
  const tb1=app.querySelector(".tabs");if(tb1)tb1.scrollLeft=sT;const ti1=app.querySelector(".tiles");if(ti1&&sameCat)ti1.scrollLeft=sI;
  if(MOUNT){const el=$("av3d");if(el)AV3.mount(el,MOUNT.av,MOUNT);}
  if(v==="name"||v==="gate"){const f=app.querySelector("input");if(f)setTimeout(()=>f.focus(),50);}
}
function topBar(title,back="home"){return `<div class="top"><button class="icon-btn" data-a="go" data-v="${back}" aria-label="Retour">⬅️</button><h1>${title}</h1><div class="coins">🪙 ${S.coins}</div></div>`;}

function scrName(){return `<div class="name-screen">${mascot("happy")}<h1>Bonjour, moi c’est Pilou !</h1><p class="muted" style="font-size:1.3rem;margin:0">Et toi, comment tu t’appelles ?</p>
  <input class="field" id="nm" maxlength="20" autocomplete="off" placeholder="Ton prénom"><button class="btn" data-a="setName">C’est parti !</button></div>`;}

function scrHome(){
  return `<div class="top"><div class="coins">🪙 ${S.coins}</div><div class="spacer"></div><button class="icon-btn" data-a="gate" aria-label="Espace parents">⚙️</button></div>
  <section class="hero"><div class="avwrap" data-a="go" data-v="shop" role="button" tabindex="0" aria-label="Habiller mon avatar">${mountAv(S.av)}</div><div class="bubble">Salut ${esc(S.name)} ! ${pick(HELLO)}<small>Réussis des niveaux pour gagner des pièces et habiller ton avatar.</small></div></section>
  <div class="worlds">${W.map(w=>`<button class="world ${w.cls}" data-a="world" data-v="${w.id}"><span class="em">${w.emoji}</span><span class="nm">${w.name}</span><span class="sb">${w.sub}</span><span class="pg">⭐ ${worldStars(w.id)} / ${w.levels.length*3}</span></button>`).join("")}</div>
  <div class="row"><button class="btn gold" data-a="go" data-v="album">📒 Mon album</button><button class="btn" data-a="go" data-v="shop">👕 Mon avatar</button></div>`;
}

function scrWorld(){
  const w=getW(view.w);
  return topBar(`${w.emoji} ${w.name}`)+`<div class="path">${w.levels.map((l,i)=>{const ok=unlocked(w.id,i);
    return `<button class="lvl ${ok?"":"locked"}" data-a="${ok?"play":"locked"}" data-v="${w.id}:${i}"><span class="n" style="background:${w.color}">${ok?i+1:"🔒"}</span><span class="t">${l[0]}</span><span class="st">${starStr(stars(w.id,i))}</span></button>`;}).join("")}</div>`;
}

function fmtPrompt(p){return p.replace(/___/,'<span class="blank" id="blank">?</span>');}
function scrGame(){
  const q=G.qs[G.i];
  const dots=G.qs.map((_,k)=>`<span class="dot ${k<G.i?"done":k===G.i?"cur":""}"></span>`).join("");
  const opts=q.type==="order"?q.items:q.choices,long=!!opts&&opts.some(c=>c.length>14);
  const ans=q.type==="order"
    ?`<div class="choices ${long?"long":""}">${q.items.map(c=>`<button class="choice" data-a="order" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`
    :q.type==="choice"
    ?`<div class="choices ${long?"long":""}">${q.choices.map((c,k)=>`<button class="choice" data-a="choose" data-v="${k}">${esc(c)}</button>`).join("")}</div>`
    :`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-a="key" data-v="${d}">${d}</button>`).join("")}<button class="key del" data-a="del" aria-label="Effacer">⌫</button><button class="key" data-a="key" data-v="0">0</button><button class="key ok" data-a="ok" aria-label="Valider">✔</button></div>`;
  return `<div class="game"><div class="gtop"><button class="icon-btn" data-a="quit" aria-label="Quitter">✕</button><div class="dots">${dots}</div><button class="icon-btn" data-a="speak" aria-label="Écouter la question">🔊</button></div>
  <div class="qcard">${q.visual?`<div class="visual">${q.visual}</div>`:""}<div class="prompt">${fmtPrompt(q.prompt)}</div></div>
  ${ans}<div class="fb" id="fb">${mascot("normal")}<div class="fbtext">${q.type==="order"?"Touche les étapes dans le bon ordre !":G.i===0?"À toi de jouer !":"Question suivante !"}</div></div></div>`;
}

function scrEnd(){
  const w=getW(G.w),e=view,next=G.li+1<w.levels.length;
  let st="";
  if(e.newSticker)st=`<div class="sticker-new"><span class="e">${w.stk[G.li]}</span>Nouvel autocollant pour ton album !</div>`;
  else if(e.gold)st=`<div class="sticker-new"><span class="e">${w.stk[G.li]}</span>Ton autocollant devient doré !</div>`;
  const msg=e.st===3?"Parfait !":e.st===2?"Très bien !":"Niveau terminé !";
  return `<div class="end"><div class="avend">${mountAv(S.av,{celebrate:true})}</div><h2>${msg}</h2><div class="bigstars">${[0,1,2].map(k=>`<span>${k<e.st?"⭐":'<span class="star-off">⭐</span>'}</span>`).join("")}</div>
  <div class="gain">+${e.gain} 🪙 <span class="muted">(total : ${S.coins})</span></div>${st}
  ${e.st<3?`<p class="muted" style="font-size:1.15rem;margin:0">Rejoue pour décrocher les 3 étoiles !</p>`:""}
  <div class="row"><button class="btn soft" data-a="play" data-v="${G.w}:${G.li}">🔁 Rejouer</button>${next?`<button class="btn good" data-a="play" data-v="${G.w}:${G.li+1}">Niveau suivant</button>`:""}${w.levels[G.li][2]?`<button class="btn soft" data-a="fiche" data-v="${G.w}:${G.li}">📖 Relire la fiche</button>`:""}<button class="btn soft" data-a="world" data-v="${G.w}">🗺️ La carte</button><button class="btn gold" data-a="go" data-v="shop">👕 Mon avatar</button></div></div>`;}

function scrFiche(){
  const w=getW(view.w),f=w.levels[view.i][2];
  return `<div class="top"><button class="icon-btn" data-a="world" data-v="${w.id}" aria-label="Retour">⬅️</button><h1>${f.title}</h1><button class="icon-btn" data-a="readFiche" aria-label="Écouter la fiche">🔊</button></div>
  <article class="fiche"><div class="fem">${f.em}</div><p>${f.paras[0]}</p>${f.widget?widget(f.widget):""}${f.paras.slice(1).map(p=>`<p>${p}</p>`).join("")}<div class="fact"><b>Le savais-tu ?</b> ${f.fact}</div></article>
  <div class="row"><button class="btn good" data-a="start">J’ai lu, je joue !</button></div>`;
}

function scrAlbum(){
  let n=0;const total=W.reduce((a,w)=>a+w.levels.length,0);
  const secs=W.map(w=>`<div class="section-title">${w.emoji} ${w.name}</div><div class="album">${w.levels.map((l,i)=>{const s=stars(w.id,i);if(s)n++;
    return s?`<div class="stk ${s===3?"gold":""}">${w.stk[i]}<small>${s===3?"doré":"⭐".repeat(s)}</small></div>`:`<div class="stk empty">?</div>`;}).join("")}</div>`).join("");
  return topBar("📒 Mon album")+`<p style="font-size:1.25rem;margin:4px 0 0">${n} autocollant${n>1?"s":""} sur ${total}. Gagne 3 étoiles pour les rendre dorés !</p>`+secs;
}

function scrShop(){
  const cat=CATS.find(c=>c.id===(view.cat||"hair")),p=view.prev,av=p?Object.assign({},S.av,{[p.cat]:p.id}):S.av;
  let act;
  if(p){const it=findItem(p.cat,p.id),can=S.coins>=it.price;
    act=`<b>${it.name}</b>${can?"":`<br><span class="muted">Il te manque ${it.price-S.coins} pièces. Joue encore un peu !</span>`}<div class="btns">${can?`<button class="btn gold" data-a="buyItem">Acheter pour 🪙 ${it.price}</button>`:""}<button class="btn soft" data-a="cancelPrev">Annuler</button></div>`;}
  else act=`<span class="muted">Fais-le tourner avec ton doigt, puis touche un objet pour l’essayer !</span>`;
  const none=cat.opt?[`<button class="tile ${!S.av[cat.id]?"on":""}" data-a="tile" data-v="${cat.id}:none"><span class="ic">🚫</span>Rien<span class="tag">${!S.av[cat.id]?"✔ Porté":"Enlever"}</span></button>`]:[];
  const tiles=none.concat(cat.items.map(it=>{
    const own=isOwned(it),on=S.av[cat.id]===it.id,sel=p&&p.id===it.id,tag=on?"✔ Porté":own?"À toi":`🪙 ${it.price}`;
    return `<button class="tile ${on?"on":""} ${sel?"sel":""} ${own?"":"price"}" data-a="tile" data-v="${cat.id}:${it.id}">${tileIc(it)}${it.name}<span class="tag">${tag}</span></button>`;}));
  return topBar("👕 Mon avatar")+`<div class="wardrobe"><div class="wprev">${mountAv(av)}<div class="wact">${act}</div></div>
  <div class="wpanel"><div class="tabs">${CATS.map(c=>`<button class="tab ${c.id===cat.id?"on":""}" data-a="tab" data-v="${c.id}">${c.name}</button>`).join("")}</div><div class="tiles">${tiles.join("")}</div></div></div>`;
}

function scrGate(){
  return topBar("Espace parents")+`<div class="panel"><h3>Réservé aux adultes</h3><p style="margin:0 0 12px">Combien font <b>${view.a} × ${view.b}</b> ?</p>
  <input class="field" id="gate" inputmode="numeric" autocomplete="off"><div style="margin-top:14px"><button class="btn" data-a="gateOk">Entrer</button></div></div>`;
}

function scrParents(){
  const sw=(k,l)=>`<div class="toggle"><span>${l}</span><button class="sw ${S[k]?"on":""}" data-a="toggle" data-v="${k}" aria-label="${l}"></button></div>`;
  const ws=W.map(w=>{const st=S.stats[w.id]||{ok:0,total:0},rate=st.total?Math.round(st.ok/st.total*100):null;
    return `<div class="panel"><h3>${w.emoji} ${w.name}</h3><p style="margin:0 0 8px" class="muted">${st.total} questions répondues${rate!==null?`, ${rate} % réussies du premier coup`:""}</p>
    ${w.levels.map((l,i)=>`<div class="lv"><span>${l[0]}</span><span>${stars(w.id,i)?starStr(stars(w.id,i)):'<span class="muted">pas encore joué</span>'}</span></div>`).join("")}</div>`;}).join("");
  return topBar("Espace parents")+ws+`<div class="panel"><h3>Réglages</h3>${sw("sound","Sons")}${sw("autoVoice","Lire les questions à voix haute automatiquement")}${sw("unlockAll","Débloquer tous les niveaux")}</div>
  <div class="panel"><h3>Prénom de l’enfant</h3><input class="field" id="pname" maxlength="20" value="${esc(S.name)}"><div style="margin-top:12px"><button class="btn soft" data-a="rename">Enregistrer le prénom</button></div></div>
  <div class="panel"><h3>Recommencer à zéro</h3><p style="margin:0 0 12px" class="muted">Efface les étoiles, les pièces, l’album et les déguisements.</p><button class="btn" style="background:var(--bad);box-shadow:0 6px 0 #c94040" data-a="reset">Tout effacer</button></div>`;
}

/* ---------- Partie ---------- */
function startGame(wid,li){
  const gen=getW(wid).levels[li][1],qs=[],keys=new Set();let g=0;
  while(qs.length<10&&g++<400){const q=gen(),k=q.key||q.prompt;if(keys.has(k))continue;keys.add(k);qs.push(q);}
  G={w:wid,li,qs,i:0,errors:0,wrong:0,input:"",locked:false,pos:0};
  view={name:"game"};render();if(S.autoVoice)say(spoken(qs[0]));
}
function setFb(html,mood){$("fb").innerHTML=mascot(mood)+`<div class="fbtext">${html}</div>`;}
function fillBlank(t){const b=$("blank");if(b){b.textContent=t;b.classList.add("filled");}}
function stat(ok){const s=S.stats[G.w]||(S.stats[G.w]={ok:0,total:0});s.total++;if(ok)s.ok++;}
function answer(correct,el){
  if(G.locked)return;const q=G.qs[G.i];
  if(correct){
    G.locked=true;stat(G.wrong===0);if(el)el.classList.add("good");
    if(q.type==="choice")fillBlank(q.answer);else{const b=$("blank");if(b)b.classList.add("filled");}
    setFb(`<b>${pick(PRAISE)}</b>`,"happy");sfx.good();setTimeout(nextQ,1100);return;
  }
  if(G.wrong===0)G.errors++;G.wrong++;sfx.bad();
  if(el){el.classList.add("bad");if(q.type==="order")setTimeout(()=>el.classList.remove("bad"),600);else el.disabled=true;}
  const reveal=G.wrong>=2||(q.type==="choice"&&q.choices.length<=2);
  if(reveal){
    G.locked=true;stat(false);fillBlank(q.answer);
    app.querySelectorAll(".choice").forEach(b=>{if(b.textContent===q.answer)b.classList.add("good");b.disabled=true;});
    setFb(`La bonne réponse est <b>${esc(q.answer)}</b>. ${q.hint}<br><button class="btn good" data-a="next">J’ai compris</button>`,"think");
  }else{
    setFb(`Presque ! ${q.hint}`,"think");
    if(q.type==="input"){G.input="";const b=$("blank");if(b)b.textContent="?";}
  }
}
function nextQ(){
  G.i++;G.wrong=0;G.input="";G.locked=false;G.pos=0;
  if(G.i>=G.qs.length)return finish();
  render();if(S.autoVoice)say(spoken(G.qs[G.i]));
}
function finish(){
  const st=G.errors<=1?3:G.errors<=3?2:1;
  const p=S.progress[G.w]||(S.progress[G.w]={});const prev=p[G.li]||0;
  p[G.li]=Math.max(prev,st);const gain=st*10;S.coins+=gain;save();
  view={name:"end",st,gain,newSticker:!prev,gold:st===3&&prev>0&&prev<3};
  render();sfx.win();confetti(st);
}
function confetti(n){
  const box=document.createElement("div");box.className="confetti";
  const cols=["#7c5cff","#12b5c6","#3ea34a","#ff8a3d","#ffc83d","#ff4f8b"];
  for(let i=0;i<n*20;i++){const c=document.createElement("i");c.style.left=Math.random()*100+"%";c.style.background=pick(cols);
    c.style.animationDuration=(1.8+Math.random()*1.6)+"s";c.style.animationDelay=Math.random()*0.6+"s";box.appendChild(c);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4200);
}

/* ---------- Actions ---------- */
const A={
  go:v=>{view={name:v};render();},
  world:v=>{view={name:"world",w:v};render();},
  play:v=>{const [w,i]=v.split(":");if(getW(w).levels[+i][2]&&!stars(w,+i)){view={name:"fiche",w,i:+i};render();}else startGame(w,+i);},
  fiche:v=>{const [w,i]=v.split(":");view={name:"fiche",w,i:+i};render();},
  start:()=>{if("speechSynthesis" in window)speechSynthesis.cancel();startGame(view.w,view.i);},
  readFiche:()=>{const f=getW(view.w).levels[view.i][2];say(f.title+". "+f.paras.join(" ")+" Le savais-tu ? "+f.fact);},
  order:(v,el)=>{if(G.locked)return;const q=G.qs[G.i];
    if(v===q.seq[G.pos]){G.pos++;el.disabled=true;el.classList.add("good");el.innerHTML=`<span class="num">${G.pos}</span>${esc(v)}`;sfx.tap();if(G.pos===q.seq.length)answer(true,null);}
    else answer(false,el);},
  locked:()=>{sfx.bad();},
  quit:()=>{if("speechSynthesis" in window)speechSynthesis.cancel();view={name:"world",w:G.w};render();},
  speak:()=>say(spoken(G.qs[G.i])),
  choose:(v,el)=>{const q=G.qs[G.i];answer(q.choices[+v]===q.answer,el);},
  key:v=>{if(G.locked||G.input.length>=5)return;G.input=(G.input==="0"?"":G.input)+v;sfx.tap();const b=$("blank");if(b)b.textContent=G.input;},
  del:()=>{if(G.locked)return;G.input=G.input.slice(0,-1);const b=$("blank");if(b)b.textContent=G.input||"?";},
  ok:()=>{if(G.locked||G.input==="")return;answer(+G.input===G.qs[G.i].answer,null);},
  next:()=>nextQ(),
  setName:()=>{const n=$("nm").value.trim();if(!n){$("nm").focus();return;}S.name=n;save();view={name:"home"};render();},
  tab:v=>{view.cat=v;view.prev=null;sfx.tap();render();},
  tile:v=>{const [c,id]=v.split(":");
    if(id==="none"){S.av[c]=null;view.prev=null;save();}
    else{const it=findItem(c,id);if(isOwned(it)){S.av[c]=id;view.prev=null;save();}else view.prev={cat:c,id};}
    sfx.tap();render();},
  buyItem:()=>{const p=view.prev;if(!p)return;const it=findItem(p.cat,p.id);if(S.coins<it.price)return;
    S.coins-=it.price;S.owned.push(it.id);S.av[p.cat]=it.id;view.prev=null;save();sfx.win();render();confetti(1);AV3.celebrate();},
  cancelPrev:()=>{view.prev=null;render();},
  gate:()=>{view={name:"gate",a:R(12,19),b:R(6,9)};render();},
  gateOk:()=>{const v=+$("gate").value;if(v===view.a*view.b){view={name:"parents"};render();}else{view={name:"home"};render();}},
  toggle:v=>{S[v]=!S[v];save();render();},
  rename:()=>{const n=$("pname").value.trim();if(n){S.name=n;save();render();}},
  reset:()=>{if(confirm("Tout effacer ? Cette action est définitive.")){const nm=S.name;S=JSON.parse(JSON.stringify(DEF));S.name=nm;save();view={name:"home"};render();}}
};
document.addEventListener("click",e=>{if(e.target.classList&&e.target.classList.contains("av3dc")&&AV3.dragged())return;const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el);});
document.addEventListener("input",e=>{if(e.target.id==="thermo")updThermo();});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){if(view.name==="name")A.setName();else if(view.name==="gate")A.gateOk();}
  if(view.name==="game"&&G&&G.qs[G.i].type==="input"){if(/^[0-9]$/.test(e.key))A.key(e.key);else if(e.key==="Backspace")A.del();else if(e.key==="Enter")A.ok();}
});
if("speechSynthesis" in window)speechSynthesis.getVoices();
render();
</script>
<script>
/* Bouton retour Android */
(function(){
  const C=window.Capacitor,CA=C&&C.Plugins&&C.Plugins.App;if(!CA)return;
  CA.addListener("backButton",()=>{
    const v=view.name;
    if(v==="game")A.quit();
    else if(v==="fiche"){view={name:"world",w:view.w};render();}
    else if(v==="end"&&G){view={name:"world",w:G.w};render();}
    else if(v==="home"||v==="name")CA.exitApp();
    else{view={name:"home"};render();}
  });
})();
</script>
</body>
